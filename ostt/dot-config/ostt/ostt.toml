config_version = "0.0.25"

[transcription]
provider = "whisper"
model = "small"

[audio]
# Let Noctalia/PipeWire choose the active microphone.
device = "default"

# Compact format suitable for speech-to-text services and local models.
output_format = "mp3 -ab 16k -ar 12000"

# Use a fixed meter reference so ambient room noise stays visually quiet.
# Closer to 0 dBFS makes the meter less sensitive, leaving more headroom for speech peaks.
reference_level_db = -6

[popup]
# Zentoo's terminal emulator for the push-to-talk popup.
terminal = "foot"
width = 45
height = 8

[process.actions.herdr]
name = "Send to Herdr agent"
type = "bash"
command = "/home/craig/.local/bin/ai-voice-prompt-herdr"
