# Fallback Herdr agent when no focused agent can be found.
default_agent = "assistant"

# Optional speech/transcription aliases for directed prompts.
# The router already tries exact, phonetic, and fuzzy matching; add aliases for
# recurring STT mistakes or preferred nicknames:
#   tell <alias> <message>
#   ask <alias> <message>
[aliases]
# alice = "assistant"

[tts]
# "auto" uses the selected Piper voice when piper is installed and the model
# exists, otherwise falls back to espeak-ng.
backend = "auto"
default_voice = "assistant"
espeak_voice = "en-us"
espeak_speed = 165

[tts.voices.assistant]
backend = "auto"
model = "/home/craig/.local/share/zentoo-voice/piper/en_US-ryan-medium.onnx"
config = "/home/craig/.local/share/zentoo-voice/piper/en_US-ryan-medium.onnx.json"
espeak_voice = "en-us"
espeak_speed = 160

[tts.voices.carrie]
backend = "auto"
model = "/home/craig/.local/share/zentoo-voice/piper/en_US-amy-medium.onnx"
config = "/home/craig/.local/share/zentoo-voice/piper/en_US-amy-medium.onnx.json"
espeak_voice = "en-us+f3"
espeak_speed = 170

[tts.agent_voices]
assistant = "assistant"
carrie = "carrie"
zentoo = "assistant"
