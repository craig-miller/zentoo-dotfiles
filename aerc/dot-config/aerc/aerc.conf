# aerc.conf — zentoo overrides.
#
# aerc does NOT merge this file with the shipped /usr/share/aerc/aerc.conf.
# Any key we omit falls back to aerc's compiled-in default, not the shipped
# template's value — in particular the [filters] section is authoritative,
# so every MIME type we want handled must appear below.
[general]
default-save-path = ~/dl/
pgp-provider = gpg
use-terminal-pinentry = true
# enable-quake-mode = true
default-menu-cmd = fzf

log-file=~/.local/state/aerc/aerc.log
log-level=debug

[ui]
styleset-name = catppuccin
dirlist-tree = true
dirlist-collapse = 1

[viewer]
alternatives = text/plain,text/html
header-layout = From|To,Cc|Bcc,Date,Subject
show-headers = false

[filters]
subject,~^Re:.*$ = awk '{ printf("Reply to: "); print; }'
text/plain = colorize
text/calendar = calendar
text/html = ! html -sixel
text/* = bat -fP --file-name="$AERC_FILENAME" --style=plain
image/* =
message/delivery-status = colorize
message/rfc822 = colorize
.headers = colorize
application/pdf = pdftotext -layout -q - -


# jmapsyncd send-path integration.  `header-layout` promotes From/To/Cc/
# Bcc/Subject to first-class TUI text-input widgets you Tab between at
# compose time.  The X-JMAP-Send-At header is seeded invisibly by the
# new_message template (defaults to `send-now`); on the review screen,
# press `t` to pick a scheduled time via fzf — aerc's :header command
# rewrites the value.  See binds.conf + the aerc-schedule-picker helper.
[compose]
header-layout = From,To,Cc,Bcc,Subject

[templates]
new-message = new_message
