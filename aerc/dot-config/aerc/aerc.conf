# aerc.conf — zentoo overrides.
#
# aerc does NOT merge this file with the shipped /usr/share/aerc/aerc.conf.
# Any key we omit falls back to aerc's compiled-in default, not the shipped
# template's value — in particular the [filters] section is authoritative,
# so every MIME type we want handled must appear below.

[ui]
styleset-name = catppuccin

[viewer]
alternatives = text/plain,text/html
header-layout = From|To,Cc|Bcc,Date,Subject
show-headers = false

[filters]
subject,~^Re:.*$ = awk '{ printf("Reply to: "); print; }'
text/plain = colorize
text/calendar = calendar
text/html = ! html -sixel
text/* = bat -fP --file-name="$AERC_FILENAME" --style=plain
image/* =
message/delivery-status = colorize
message/rfc822 = colorize
.headers = colorize
application/pdf = pdftotext -layout -q - -
[general]
log-file=~/.local/state/aerc/aerc.log
log-level=debug
