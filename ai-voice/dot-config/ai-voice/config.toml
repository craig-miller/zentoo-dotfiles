[assistant]
# User-facing assistant identity. The wake phrase and display name are
# configurable; scripts should not hard-code an assistant name.
name = "Carrie"
wake_phrase = "hey carrie"
display_name = "Carrie"

# Fallback Herdr agent when no focused agent can be found.
default_agent = "carrie"

# Optional speech/transcription aliases for directed prompts.
# The router already tries exact, phonetic, and fuzzy matching; add aliases for
# recurring STT mistakes or preferred nicknames:
#   tell <alias> <message>
#   ask <alias> <message>
[aliases]
# alice = "assistant"

# Full-phrase STT corrections before grammar parsing. These are for recurring
# command-prefix mistakes, not agent-name aliases.
[phrase_corrections]
# "that's scary" = "ask carrie"
# "house kerry" = "ask carrie"

[wake]
enabled = true
backend = "violawake"
threshold = 0.80
confirm_count = 3
cooldown_ms = 2000
display_name = "Carrie Wake Listener"

# kind = "open" starts/reuses that agent's active voice session. If the agent
# is currently inactive, the first routed prompt starts a fresh Pi context.
[[wake.words]]
phrase = "carrie"
agent = "carrie"
kind = "open"
model = "/home/craig/.local/share/ai-voice/wake/carrie.onnx"
threshold = 0.80
confirm_count = 3

[[wake.words]]
phrase = "bodhi"
agent = "bodhi"
kind = "open"
model = "/home/craig/.local/share/ai-voice/wake/bodhi.onnx"
threshold = 0.92
confirm_count = 3

# Closure wake phrases use kind = "close". target = "last" deactivates the
# most recently invoked agent.
[[wake.words]]
phrase = "thanks"
agent = "last"
kind = "close"
target = "last"
model = "/home/craig/.local/share/ai-voice/wake/thanks.onnx"
threshold = 0.92
confirm_count = 3

[tts]
# "auto" uses the selected Piper voice when piper is installed and the model
# exists, otherwise falls back to espeak-ng.
backend = "auto"
default_voice = "carrie"
server_enabled = true
server_url = "http://127.0.0.1:50321"
espeak_voice = "en-us"
espeak_speed = 165

[tts.voices.assistant]
backend = "auto"
model = "/home/craig/.local/share/ai-voice/piper/en_US-ryan-medium.onnx"
config = "/home/craig/.local/share/ai-voice/piper/en_US-ryan-medium.onnx.json"
espeak_voice = "en-us"
espeak_speed = 160

[tts.voices.carrie]
backend = "auto"
model = "/home/craig/.local/share/ai-voice/piper/en_US-amy-medium.onnx"
config = "/home/craig/.local/share/ai-voice/piper/en_US-amy-medium.onnx.json"
espeak_voice = "en-us+f3"
espeak_speed = 170

[tts.agent_voices]
assistant = "carrie"
carrie = "carrie"
bodhi = "assistant"
zentoo = "assistant"
